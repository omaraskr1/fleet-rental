name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    services:
      # Integration tests run against real SQL Server on purpose. The unique index
      # that makes double-booking impossible does not exist in EF InMemory, so a
      # suite using it would pass while the guarantee was broken.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'Local!TestPassword123' }}
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Microsoft.ML.Mkl.Redist (pulled in transitively by Microsoft.ML.TimeSeries,
      # for the revenue forecast's SSA model) bundles Intel's OpenMP runtime for
      # Windows but not for Linux — it assumes the OS already provides
      # libiomp5.so under that exact name. A bare ubuntu-latest image doesn't.
      #
      # GNU's libgomp is NOT a substitute here — it fails with "version 'VERSION'
      # not found", since MKL calls into libiomp5's versioned symbols and GNU's
      # implementation doesn't carry the same version nodes. LLVM's libomp is:
      # Intel donated much of libiomp5's implementation to LLVM as libomp, so it
      # is the actual documented substitute, symlinked under the name MKL expects.
      - name: Install MKL's OpenMP runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp5
          # libomp5 on recent Ubuntu is a transitional metapackage — the actual
          # shared library ships in a versioned package (e.g. libomp5-18), so
          # locate it on disk rather than assume which package or path owns it.
          sudo ln -sf "$(find /usr/lib -name 'libomp.so.*' | head -n1)" /usr/lib/x86_64-linux-gnu/libiomp5.so

      - name: Restore
        run: dotnet restore backend/FleetRental.slnx

      - name: Build
        run: dotnet build backend/FleetRental.slnx --no-restore --configuration Release

      - name: Unit tests
        run: >-
          dotnet test backend/tests/FleetRental.UnitTests
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - name: Integration tests
        env:
          FLEETRENTAL_TEST_CONNECTION: >-
            Server=localhost,1433;Database=FleetRental_Test;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD || 'Local!TestPassword123' }};TrustServerCertificate=True
        run: >-
          dotnet test backend/tests/FleetRental.IntegrationTests
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          retention-days: 14

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Runs under Vitest in jsdom (the Angular 22 default), not a real browser —
      # no --browsers flag, so no Chrome/Playwright install is needed on the runner.
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --no-watch

      - name: Production build
        working-directory: frontend
        run: npm run build

      # A green build that quietly stopped shipping the app would be worse than
      # a red one, so assert the bundle actually exists.
      - name: Verify bundle was produced
        working-directory: frontend
        run: test -f dist/frontend/browser/index.html
