services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Test-Only-Pwd-2026!"
    ports:
      # Host 14330, not 1433: this machine's local SQL Express instance
      # already owns 1433.
      - "14330:1433"
    volumes:
      - fleetrental_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development, not Production, so Swagger UI stays reachable at
      # /swagger for anyone poking the API directly in this test stack.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FleetRental: "Server=db;Database=FleetRental;User Id=sa;Password=Test-Only-Pwd-2026!;TrustServerCertificate=True"
      # Test-environment-only secrets. Never reuse these for a real deploy.
      Jwt__Key: "docker-test-environment-signing-key-not-for-production-use"
      Seed__AdminPassword: "ChangeMe!2026"
      Platform__ProvisioningKey: "docker-test-provisioning-key"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Cors__AllowedOrigins__1: "http://localhost:4200"
    ports:
      - "5180:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  fleetrental_db_data:
