server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing: unmatched paths fall back to index.html rather than a
    # raw nginx 404, since the Angular router owns everything under them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "api" resolves via Docker's embedded DNS to the backend service defined
    # in docker-compose.yml. The frontend build never bakes in a host — see
    # environment.docker.ts.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (LocationHub, feature 6) needs the WebSocket upgrade headers on
    # top of the plain HTTP proxying above — a normal reverse-proxy block
    # silently downgrades the connection to failed long-polling instead.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
